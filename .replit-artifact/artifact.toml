kind = "web"
previewPath = "/"
title = "The Premium Studio Salon"
version = "1.0.0"
id = "artifacts/premium-studio-salon"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18147

[services.development]
run = "pnpm --filter @workspace/premium-studio-salon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/premium-studio-salon", "run", "build" ]
serve = "static"
publicDir = "artifacts/premium-studio-salon/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18147"
BASE_PATH = "/"
